spring.application.name=aura

server.port=8082

# -----Database ------
spring.datasource.url=jdbc:postgresql://localhost:5432/aura
spring.datasource.username=postgres
spring.datasource.password=rakshith

# ----------------------JPA / Hibernate---------------------------
# Hibernate auto-creates / updates tables from entity classes
spring.jpa.hibernate.ddl-auto=update

# Print SQL to console (useful for debugging)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# PostgreSQL dialect
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Prevents lazy-loading issues in REST controllers
spring.jpa.open-in-view=false

# ----------------JWT-----------------------
# Base64-encoded HS256 secret key (256 bits required).
# IMPORTANT: Change this before deploying to production!
jwt.secret=YXVyYVNlY3JldEtleUZvckp3dEF1dGhlbnRpY2F0aW9uMjAyNkF1cmFQcm9qZWN0

# Token expiration: 24 hours in milliseconds (24 * 60 * 60 * 1000)
jwt.expiration=86400000

#--------------------------------Logging-----
logging.level.com.project.aura=DEBUG
logging.level.org.springframework.security=INFO

#------------------(Voice Call + SMS for SOS Alerts)--------------------------------------------------------
# These values are loaded from .env via System.setProperty in AuraApplication.java
twilio.account-sid=${TWILIO_ACCOUNT_SID:}
twilio.auth-token=${TWILIO_AUTH_TOKEN:}
twilio.phone-number=${TWILIO_PHONE_NUMBER:}
twilio.voice-url=${TWILIO_VOICE_URL:http://demo.twilio.com/docs/voice.xml}

# Set to true to enable real calls/SMS
twilio.enabled=${TWILIO_ENABLED:true}