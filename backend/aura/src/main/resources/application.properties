spring.application.name=aura

spring.config.import=optional:file:.env[.properties]

server.port=8082

spring.security.user.name=rakshi
spring.security.user.password =Java


#the database url
spring.datasource.url=jdbc:postgresql://localhost:5432/aura
spring.datasource.username=postgres
spring.datasource.password=rakshith


# Tells Hibernate to automatically create/update database tables
spring.jpa.hibernate.ddl-auto=update

# Shows generated SQL in console (great for debugging!)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Ensures dialect matches PostgreSQL
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

JWT_SECRET=YXVyYVNlY3JldEtleUZvckp3dEF1dGhlbnRpY2F0aW9uMjAyNkF1cmFQcm9qZWN0
# Token expiration: 24 hours in milliseconds (24 * 60 * 60 * 1000)
jwt.expiration=86400000

# Logging
logging.level.com.project.aura=DEBUG
logging.level.org.springframework.security=INFO

# Twilio (Voice Call + SMS for SOS Alerts)
# i need to paste twilio api key here or in .env
twilio.account-sid=YOUR_TWILIO_ACCOUNT_SID
twilio.auth-token=YOUR_TWILIO_AUTH_TOKEN
twilio.phone-number=YOUR_TWILIO_PHONE_NUMBER

# Set to true to enable Twilio calls/SMS. Keep false during development
# to avoid accidental charges. Set to true when ready to test with real calls.
twilio.enabled=false